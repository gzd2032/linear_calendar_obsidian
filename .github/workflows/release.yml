name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify bare semver tag
        id: tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" == v* ]]; then
            echo "Use a bare version tag (e.g. 1.0.1), not '$tag'."
            exit 1
          fi
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Tag '$tag' is not a valid semver version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Verify manifest version matches tag
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          manifest_version="$(node -e 'process.stdout.write(require("./manifest.json").version)')"
          if [ "$manifest_version" != "$tag" ]; then
            echo "manifest.json version ($manifest_version) does not match tag ($tag)"
            exit 1
          fi

      - name: Stage release assets
        run: |
          # Obsidian requires these three files as direct GitHub Release assets.
          # Do not upload a custom zip — Obsidian ignores it and the scanner flags it.
          test -f main.js && test -f manifest.json && test -f styles.css
          ls -la main.js manifest.json styles.css

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # Upload only Obsidian install assets. GitHub still shows auto Source code archives.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            gh release create "$tag" \
              --title="$tag" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
