<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Linear Year Calendar preview</title>
		<link rel="stylesheet" href="../styles.css" />
		<style>
			/* Stand-in Obsidian tokens so preview works outside the app. */
			:root {
				color-scheme: light dark;
				--background-primary: #ffffff;
				--background-primary-alt: #fbf9f4;
				--background-secondary: #f7f7f5;
				--background-secondary-alt: #eef0f3;
				--background-modifier-border: #e1e1db;
				--background-modifier-hover: rgba(0, 0, 0, 0.06);
				--background-modifier-form-field: #ffffff;
				--text-normal: #2b2b2b;
				--text-muted: #8b8b84;
				--text-faint: #a3a39c;
				--text-on-accent: #ffffff;
				--text-accent: #c7783a;
				--text-error: #d4534b;
				--interactive-accent: #e8904a;
				--interactive-accent-hover: #d67d38;
				--modal-background: #ffffff;
				--shadow-s: 0 8px 28px rgba(0, 0, 0, 0.12);
				--shadow-l: 0 12px 40px rgba(0, 0, 0, 0.18);
				--font-interface: system-ui, -apple-system, "Segoe UI", sans-serif;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--background-primary: #1e1e1e;
					--background-primary-alt: #242424;
					--background-secondary: #2a2a2a;
					--background-secondary-alt: #323232;
					--background-modifier-border: #3f3f3f;
					--background-modifier-hover: rgba(255, 255, 255, 0.08);
					--background-modifier-form-field: #1e1e1e;
					--text-normal: #dcddde;
					--text-muted: #999999;
					--text-faint: #666666;
					--text-on-accent: #1e1e1e;
					--text-accent: #f0a060;
					--text-error: #e46d64;
					--interactive-accent: #e8904a;
					--interactive-accent-hover: #f0a060;
					--modal-background: #262626;
				}
			}

			html,
			body {
				margin: 0;
				height: 100%;
				background: var(--background-primary);
				color: var(--text-normal);
			}
			body {
				display: flex;
				flex-direction: column;
			}
			#preview-status {
				flex: 0 0 auto;
				padding: 8px 14px;
				font: 13px/1.35 system-ui, sans-serif;
				background: #1f1f1f;
				color: #f5f5f5;
			}
			#preview-status[hidden] {
				display: none;
			}
			#app {
				flex: 1;
				min-height: 0;
			}
		</style>
	</head>
	<body>
		<div id="preview-status" hidden aria-live="polite"></div>
		<div id="app"></div>
		<script src="./preview.js"></script>
	</body>
</html>
