<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Linear Year Calendar preview</title>
		<link rel="stylesheet" href="../styles.css" />
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
			}
			body {
				display: flex;
				flex-direction: column;
			}
			#preview-status {
				flex: 0 0 auto;
				padding: 8px 14px;
				font: 13px/1.35 system-ui, sans-serif;
				background: #1f1f1f;
				color: #f5f5f5;
			}
			#preview-status[hidden] {
				display: none;
			}
			#app {
				flex: 1;
				min-height: 0;
			}
		</style>
	</head>
	<body>
		<div id="preview-status" hidden aria-live="polite"></div>
		<div id="app"></div>
		<script src="./preview.js"></script>
	</body>
</html>
